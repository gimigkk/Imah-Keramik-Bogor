<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imah Keramik Bogor — Wisata Edukasi Tanah Liat & Keramik</title>
    <meta name="description" content="Wisata edukasi tanah liat & keramik di Bogor. Dapatkan pengalaman meditatif membuat keramik teknik putar, teknik tangan, glasir & lukis." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      if (window.location.hash) {
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
      }
      window.scrollTo(0, 0);
      window.addEventListener('beforeunload', function() {
        window.scrollTo(0, 0);
      });
      window.onerror = function(message, source, lineno, colno, error) {
        const errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:red;color:white;z-index:99999;padding:2rem;font-size:20px;white-space:pre-wrap;overflow:auto;';
        errDiv.innerText = "CRASH: " + message + "\n" + (error ? error.stack : "");
        document.body.appendChild(errDiv);
      };
      window.addEventListener('unhandledrejection', function(event) {
        const errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:red;color:white;z-index:99999;padding:2rem;font-size:20px;white-space:pre-wrap;overflow:auto;';
        errDiv.innerText = "PROMISE CRASH: " + event.reason;
        document.body.appendChild(errDiv);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
